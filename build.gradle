plugins {
    id 'java'
}

allprojects {
    group = 'com.specgen'
    version = '1.0.0'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(26)
        }
    }

    tasks.withType(Test).configureEach {
        testLogging {
            events "passed", "skipped", "failed"
            showStandardStreams = false // Mantenemos streams ocultos por defecto para evitar ruido, pero mostramos eventos
            exceptionFormat "full"
        }
    }
}
