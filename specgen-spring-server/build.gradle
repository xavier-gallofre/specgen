plugins {
    id 'java-library'
}

dependencies {
    // Dependencia del core de OpenAPI Generator
    api 'org.openapitools:openapi-generator:7.4.0'
    
    // Contiene los generadores oficiales, incluido SpringCodegen
    api 'org.openapitools:openapi-generator-core:7.4.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.test {
    useJUnitPlatform()
}
